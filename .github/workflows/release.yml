name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - name: Install fixture Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0"'
      - name: Require the tag to match VERSION
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Test and verify coverage
        run: ./gradlew --no-daemon clean test :koverVerify
      - name: Verify fixtures
        run: |
          ./gradlew --no-daemon :cli:installDist
          Scripts/verify-agent-surface.sh
          python3 Scripts/verify-runtime-corpus.py
          python3 Scripts/verify-runtime-contracts.py
          Scripts/verify-fixture-corpus.sh
          Scripts/verify-gradle-plugin-fixture.sh
          python3 -m unittest discover -s Scripts/tests -v
      - name: Verify optional compiler collectors
        run: KARTOGRAPH_SNAPSHOT_CLI="$PWD/cli/build/install/kartograph/bin/kartograph" ./gradlew --no-daemon -p compiler-collectors integrationTest
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.10.2'
      - name: Verify minimum supported AGP and Gradle
        shell: bash
        run: |
          export GRADLE_8_HOME="$(dirname "$(dirname "$(command -v gradle)")")"
          bash Scripts/verify-agp-8-fixture.sh
          bash Scripts/verify-agp-8-app-snapshot.sh
      - name: Verify release artifacts without publishing
        run: Scripts/verify-release-readiness.sh
      - name: Preserve release readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-readiness
          path: |
            build/reports/release-readiness/*.sha256
            build/reports/release-readiness/**/*.log
            build/reports/release-readiness/**/build.stdout
            build/reports/release-readiness/**/build.stderr
            build/reports/release-readiness/**/verification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --generate-notes --title "kartograph $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            "cli/build/distributions/kartograph-$RELEASE_VERSION.zip" \
            "cli/build/distributions/kartograph-$RELEASE_VERSION.tar" \
            "gradle-plugin/build/libs/kartograph-gradle-plugin-$RELEASE_VERSION.jar" \
            "compiler-collectors/build/distributions/kartograph-compiler-collectors-$RELEASE_VERSION.zip" \
            "build/release/kartograph-$RELEASE_VERSION.cdx.json" \
            "build/release/kartograph-gradle-plugin-$RELEASE_VERSION.cdx.json" \
            "build/release/SHA256SUMS"
      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew --no-daemon :gradle-plugin:publishPlugins
