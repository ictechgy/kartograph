name: CLI repeatability qualification

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full reviewed commit SHA for the same-executable diagnostic
        required: true
        type: string
      runtime_profile:
        description: One bounded Linux runtime diagnostic (not repeatability or acceptance)
        required: false
        default: false
        type: boolean
      jit_attribution:
        description: One sealed dead-private JIT/OSR attribution pair (not acceptance)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cli-repeatability-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate the requested identity
        shell: bash
        env:
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          JIT_ATTRIBUTION: ${{ inputs.jit_attribution }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full lowercase commit SHA" >&2
            exit 64
          }
          if [[ "$RUNTIME_PROFILE" == 'true' && "$TARGET_SHA" != 'c8d9ab3e3492afc5dc645dcfa50d7401c58796c2' ]]; then
            echo "runtime profiling requires the sealed PR 204 synthetic merge" >&2
            exit 64
          fi
          if [[ "$JIT_ATTRIBUTION" == 'true' ]]; then
            if [[ "$RUNTIME_PROFILE" == 'true' || "$TARGET_SHA" != 'c8d9ab3e3492afc5dc645dcfa50d7401c58796c2' ]]; then
              echo "JIT attribution requires the sealed target and a separate diagnostic run" >&2
              exit 64
            fi
          fi
          printf 'EVIDENCE_DIRECTORY=%s/cli-repeatability\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
      - name: Verify and record both checkouts
        shell: bash
        run: |
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "$EVIDENCE_DIRECTORY"
          git -C harness rev-parse HEAD HEAD^{tree} > "$EVIDENCE_DIRECTORY/harness-source.txt"
          git -C target rev-parse HEAD HEAD^{tree} > "$EVIDENCE_DIRECTORY/target-source.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$EVIDENCE_DIRECTORY/workflow.txt"
          sha256sum harness/Scripts/verify-cli-repeatability.py harness/experiments/cli-repeatability/README.md target/Scripts/verify-analysis-smoke-gate.py > "$EVIDENCE_DIRECTORY/scripts.sha256"
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          # 입력 SHA의 코드를 실행한 뒤 기본 브랜치 범위 캐시를 저장하지 않도록 복원만 한다.
          cache-read-only: true
      - name: Build the single installation and corpus
        shell: bash
        working-directory: target
        run: |
          set +e
          # 별도 Kotlin daemon이 측정 중 살아 있지 않도록 빌드 프로세스 안에서 컴파일한다.
          ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :cli:installDist :gradle-plugin:classes 2>&1 | tee "$EVIDENCE_DIRECTORY/setup.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$EVIDENCE_DIRECTORY/setup-exit.txt"
          printf '%s\n' "${statuses[1]}" > "$EVIDENCE_DIRECTORY/setup-log-exit.txt"
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Run the fixed same-executable qualification
        if: ${{ !inputs.runtime_profile && !inputs.jit_attribution }}
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 900 python3 harness/Scripts/verify-cli-repeatability.py \
            --repo-root "$GITHUB_WORKSPACE/target" --target-sha "$TARGET_SHA" \
            --output "$EVIDENCE_DIRECTORY/capture" > "$EVIDENCE_DIRECTORY/driver.stdout" 2> "$EVIDENCE_DIRECTORY/driver.stderr"
          rc=$?
          printf '%s\n' "$rc" > "$EVIDENCE_DIRECTORY/outer-exit.txt"
          exit "$rc"
      - name: Diagnose the sealed PR 204 Linux runtime once
        if: ${{ inputs.runtime_profile }}
        timeout-minutes: 16
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 900 python3 harness/Scripts/verify-linux-runtime-cost.py \
            --repo-root "$GITHUB_WORKSPACE/target" --target-sha "$TARGET_SHA" \
            --output "$EVIDENCE_DIRECTORY/runtime-public"
          rc=$?
          exit "$rc"
      - name: Preserve the complete diagnostic outcome
        if: ${{ always() && !inputs.runtime_profile && !inputs.jit_attribution }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-repeatability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-repeatability/
            !${{ runner.temp }}/cli-repeatability/capture/tmp/**
          if-no-files-found: error
          retention-days: 14
      - name: Attribute the sealed largest command once
        if: ${{ inputs.jit_attribution }}
        timeout-minutes: 8
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=15s 450 python3 harness/Scripts/verify-jit-attribution.py \
            --repo-root "$GITHUB_WORKSPACE/target" --target-sha "$TARGET_SHA" \
            --output "$EVIDENCE_DIRECTORY/jit-public"
      - name: Preserve only allowlisted JIT derivatives
        if: ${{ always() && inputs.jit_attribution }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-repeatability/jit-public/result.json
            ${{ runner.temp }}/cli-repeatability/jit-public/events-dead-private.json.gz
          if-no-files-found: error
          retention-days: 14
      - name: Preserve only allowlisted runtime derivatives
        if: ${{ always() && inputs.runtime_profile }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cli-repeatability/runtime-public/result.json
            ${{ runner.temp }}/cli-repeatability/runtime-public/events-graph.json.gz
            ${{ runner.temp }}/cli-repeatability/runtime-public/events-dead.json.gz
            ${{ runner.temp }}/cli-repeatability/runtime-public/events-dead_private.json.gz
            ${{ runner.temp }}/cli-repeatability/runtime-public/events-cycles.json.gz
            ${{ runner.temp }}/cli-repeatability/runtime-public/events-rules.json.gz
            ${{ runner.temp }}/cli-repeatability/runtime-public/events-metrics.json.gz
          if-no-files-found: error
          retention-days: 14
