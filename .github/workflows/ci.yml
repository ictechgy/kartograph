name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install fixture Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test and verify coverage
        run: ./gradlew --no-daemon clean test :koverVerify :cli:installDist
      - name: Verify CLI contract
        run: Scripts/verify-cli-contract.sh
      - name: Verify PR gate against real Git and compiler outputs
        run: python3 -m unittest discover -s Scripts/tests -v
      - name: Verify analysis smoke gate and self-analysis contracts
        run: python3 Scripts/verify-analysis-smoke-gate.py
      - name: Verify agent query and bridge contracts
        run: Scripts/verify-agent-surface.sh
      - name: Verify runtime blind-spot corpus
        run: python3 Scripts/verify-runtime-corpus.py
      - name: Verify runtime and R8 differential contracts
        run: python3 Scripts/verify-runtime-contracts.py
      - name: Compare compiler references before constant inlining
        run: python3 experiments/compiler-references/run.py
      - name: Verify Dagger selected binding evidence
        run: python3 experiments/dagger-bindings/run.py
      - name: Verify compiler collectors and product evidence lifecycle
        run: |
          ./gradlew --no-daemon -p compiler-collectors integrationTest
          python3 Scripts/verify-compiler-evidence.py
      - name: Preserve compiler evidence validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-evidence-validation
          path: build/reports/compiler-evidence-integration/
          if-no-files-found: ignore
          retention-days: 14
      - name: Compare callgraph precision
        run: python3 experiments/callgraph-precision/run.py
      - name: Preserve precision comparison evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: callgraph-precision
          path: |
            build/reports/callgraph-precision/results.json
            build/reports/callgraph-precision/timings.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify Android fixture corpus
        run: Scripts/verify-fixture-corpus.sh
      - name: Verify Gradle plugin against Android fixture
        run: Scripts/verify-gradle-plugin-fixture.sh
      - name: Validate release metadata without publishing
        run: |
          ./gradlew --no-daemon :gradle-plugin:validatePlugins :gradle-plugin:generatePomFileForPluginMavenPublication

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Verify supported JDK
        run: ./gradlew --no-daemon -Pkartograph.javaVersion=${{ matrix.java }} test :gradle-plugin:validatePlugins

  agp-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.10.2'
      - name: Verify minimum supported AGP and Gradle
        shell: bash
        run: |
          export GRADLE_8_HOME="$(dirname "$(dirname "$(command -v gradle)")")"
          bash Scripts/verify-agp-8-fixture.sh
