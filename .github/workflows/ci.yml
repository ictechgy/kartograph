name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # 전체 테스트·index-cost·runtime 검증만으로 느린 runner에서 약 34~35분이라 기존 30분 예산을 넘는다.
    # collector·compiler 증거와 Android fixture는 별도 job이다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # android-actions/setup-android v4.0.1은 cmdline-tools 구 URL 변경(android-actions#536)으로
      # 404가 난다. 러너 기본 sdkmanager로 라이선스를 승인하고 필요한 패키지를 설치한다.
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - name: Install fixture Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Test and verify coverage
        id: candidate-build
        # Kotlin 컴파일 daemon만 늘린다. 테스트·CLI JVM과 분석 시간 예산은 그대로 둔다.
        run: ./gradlew --no-daemon -Pkotlin.daemon.jvmargs=-Xmx1g clean test :koverVerify :cli:installDist
      - name: Observe Kotlin compiler heap after primary build
        if: always()
        timeout-minutes: 1
        run: python3 Scripts/observe-kotlin-daemon-heap.py
      - name: Verify non-privileged POSIX permission regressions
        run: python3 Scripts/verify-posix-permission-tests.py
      - name: Verify actual DataBinding processor regression execution
        run: python3 Scripts/verify-databinding-processor-test.py
      - name: Preserve DataBinding processor evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: databinding-processor-test
          path: |
            build/reports/databinding-processor-test.json
            gradle-plugin/build/test-results/test/TEST-dev.kartograph.gradle.AndroidDataBindingIntegrationTest.xml
            gradle-plugin/build/test-results/test/TEST-dev.kartograph.gradle.AndroidHiltIntegrationTest.xml
            gradle-plugin/build/reports/hilt-transform/hilt-snapshot-*.json
            gradle-plugin/build/reports/hilt-transform/observations.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve POSIX permission evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: posix-permission-tests
          path: |
            build/reports/posix-permission-tests.json
            index/build/test-results/test/TEST-dev.kartograph.index.SourceDirectoryFailureTest.xml
            index/build/test-results/test/TEST-dev.kartograph.index.AndroidXmlScannerTest.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve failed test details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-tests
          path: '*/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify CLI contract
        id: cli_contract
        run: Scripts/verify-cli-contract.sh
      - name: Verify PR gate against real Git and compiler outputs
        run: python3 -m unittest discover -s Scripts/tests -v
      - name: Verify caller and behavior evaluation contracts
        run: python3 -m unittest discover -s experiments/ai-utility-v7 -p 'test*.py' -v
      - name: Verify real-module evaluation and native JUnit evidence
        run: |
          python3 -m unittest discover -s experiments/ai-utility-v8 -p 'test*.py' -v
          python3 experiments/ai-utility-v8/verify_observer.py --jdk "$JAVA_HOME" --download-junit --output build/reports/ai-utility-v8-observer
      - name: Preserve native JUnit observer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-utility-v8-observer
          path: |
            build/reports/ai-utility-v8-observer/verification.json
            build/reports/ai-utility-v8-observer/base/*.json*
            build/reports/ai-utility-v8-observer/changed/*.json*
            build/reports/ai-utility-v8-observer/failed-sink.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify automatic Gradle snapshots and CI impact
        run: python3 Scripts/verify-gradle-impact-ci.py
      - name: Preserve Gradle impact CI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gradle-impact-ci
          path: build/reports/gradle-impact-ci/result.json
          if-no-files-found: error
          retention-days: 14
      # 계약과 절대 안전 상한(10초/40초)만 판정한다. 시간 수용 기준은 performance job의 같은 runner 기준 비교다.
      - name: Verify analysis smoke gate and self-analysis contracts
        run: python3 Scripts/verify-analysis-smoke-gate.py --json --per-command-budget 10 --total-budget 40
      - name: Diagnose fixed-input index cost without changing the smoke gate
        if: ${{ always() && !cancelled() && steps.candidate-build.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 Scripts/verify-index-cost.py
      - name: Preserve bounded index cost evidence
        if: ${{ always() && !cancelled() && steps.candidate-build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: index-cost
          path: |
            build/reports/index-cost/result.json
            build/reports/index-cost/raw/*.gz
            build/reports/index-cost/jfr/*.jfr
          if-no-files-found: error
          retention-days: 14
      - name: Verify agent query and bridge contracts
        run: Scripts/verify-agent-surface.sh
      - name: Verify runtime blind-spot corpus
        run: python3 Scripts/verify-runtime-corpus.py
      - name: Verify runtime and R8 differential contracts
        run: python3 Scripts/verify-runtime-contracts.py
      - name: Compare compiler references before constant inlining
        run: python3 experiments/compiler-references/run.py

  # smoke 단계가 느린 runner에서도 통과하자 전체 test job이 Xeon 8370C·EPYC 7763에서 약 52~53분으로 45분 제한을
  # 넘었다. 뒤쪽 collector·compiler 증거 단계를 같은 명령·순서·조건으로 독립된 45분 job에 둔다(97bd6e8과 같은 방식).
  compiler-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # 독립 checkout에서도 test job의 primary build와 같은 compiler heap으로 아래 단계가 쓰는 CLI·plugin JAR과
      # test class를 만든다. call position 단계는 root module test를 실행하므로, test class가 없으면 그 단계가 기본
      # heap으로 컴파일하다 OOM이 난다(test job에서는 primary build가 미리 컴파일해 UP-TO-DATE였다).
      - name: Prepare compiler evidence CLI, plugin and test classes
        id: candidate-build
        run: ./gradlew --no-daemon -Pkotlin.daemon.jvmargs=-Xmx1g :cli:installDist :gradle-plugin:jar testClasses
      # 옮긴 단계의 조건이 test job에서와 같은 뜻이 되도록 이 job의 설치본에도 같은 CLI 계약 검증을 둔다.
      - name: Verify CLI contract
        id: cli_contract
        run: Scripts/verify-cli-contract.sh
      # 시간 게이트 실패 뒤에도 성공한 설치물을 쓰는 독립 정확성 검증은 남긴다.
      - name: Verify Dagger selected binding evidence
        id: dagger_evidence
        if: ${{ !cancelled() && steps.candidate-build.outcome == 'success' && steps.cli_contract.outcome == 'success' }}
        run: python3 experiments/dagger-bindings/run.py
      - name: Verify compiler collectors and product evidence lifecycle
        id: collector_lifecycle
        if: ${{ !cancelled() && steps.candidate-build.outcome == 'success' && steps.cli_contract.outcome == 'success' }}
        run: |
          KARTOGRAPH_SNAPSHOT_CLI="$PWD/cli/build/install/kartograph/bin/kartograph" ./gradlew --no-daemon -p compiler-collectors \
            -Pkartograph.consumerDistribution="$PWD/cli/build/install/kartograph" integrationTest distZip
          python3 Scripts/verify-collector-installation.py \
            --archive "compiler-collectors/build/distributions/kartograph-compiler-collectors-$(cat VERSION).zip" \
            --version "$(cat VERSION)" --evidence build/reports/collector-installation
      # Dagger 검증이 만드는 fixture JAR와 collector 설치 검증을 모두 요구한다.
      - name: Verify Gradle compiler evidence lifecycle
        if: ${{ !cancelled() && steps.candidate-build.outcome == 'success' && steps.cli_contract.outcome == 'success' && steps.dagger_evidence.outcome == 'success' && steps.collector_lifecycle.outcome == 'success' }}
        run: python3 Scripts/verify-compiler-evidence.py
      - name: Verify exact compiler call positions without skipped checks
        run: python3 Scripts/verify-compiler-call-positions.py
      - name: Preserve compiler evidence validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-evidence-validation
          path: |
            build/reports/compiler-evidence-integration/
            build/reports/compiler-call-positions/
            build/reports/collector-installation/*.log
            build/reports/collector-installation/**/build.stdout
            build/reports/collector-installation/**/build.stderr
            build/reports/collector-installation/verification.json
            compiler-collectors/build/reports/public-authored-api/public-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Compare callgraph precision
        run: python3 experiments/callgraph-precision/run.py
      - name: Preserve precision comparison evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: callgraph-precision
          path: |
            build/reports/callgraph-precision/results.json
            build/reports/callgraph-precision/timings.json
          if-no-files-found: error
          retention-days: 14
  android-fixtures:
    name: Android fixtures and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - name: Install fixture Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      # 독립 checkout에서도 원래 primary build와 같은 compiler heap으로 CLI/plugin을 먼저 만든다.
      - name: Prepare fixture CLI and plugin
        run: ./gradlew --no-daemon -Pkotlin.daemon.jvmargs=-Xmx1g :cli:installDist :gradle-plugin:jar
      - name: Verify Android fixture corpus
        run: Scripts/verify-fixture-corpus.sh
      - name: Verify Gradle plugin against Android fixture
        run: Scripts/verify-gradle-plugin-fixture.sh
      - name: Validate release metadata without publishing
        run: |
          ./gradlew --no-daemon :gradle-plugin:validatePlugins :gradle-plugin:generatePomFileForPluginMavenPublication

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - name: Install Android snapshot test platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Verify owned-directory capture capabilities on Linux
        timeout-minutes: 2
        run: java Scripts/VerifySecureDirectoryStream.java
      - name: Verify supported JDK
        shell: bash
        run: |
          # 양쪽 JDK에서 관측한 Kotlin 컴파일 heap 부족만 다룬다.
          printf '%s\n' 'Requested Kotlin daemon maximum heap: 1 GiB; a separate observation records available process flags.'
          ./gradlew --no-daemon -Pkartograph.javaVersion=${{ matrix.java }} -Pkotlin.daemon.jvmargs=-Xmx1g test :gradle-plugin:validatePlugins
      - name: Observe Kotlin compiler heap after compatibility build
        if: always()
        timeout-minutes: 1
        run: python3 Scripts/observe-kotlin-daemon-heap.py
      - name: Preserve failed compatibility test details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-tests-jdk-${{ matrix.java }}
          path: '*/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  agp-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '8.10.2'
      - name: Verify minimum supported AGP and Gradle
        shell: bash
        run: |
          export GRADLE_8_HOME="$(dirname "$(dirname "$(command -v gradle)")")"
          bash Scripts/verify-agp-8-fixture.sh
      - name: Verify dependency advice on minimum Gradle and AGP
        shell: bash
        run: |
          ./gradlew --no-daemon :gradle-plugin:jar
          plugin_jar="gradle-plugin/build/libs/kartograph-gradle-plugin-$(tr -d '[:space:]' < VERSION).jar"
          python3 Scripts/verify-dependency-fixture.py --gradle "$(command -v gradle)" --plugin-jar "$plugin_jar" --output build/reports/dependency-min-jvm
          python3 Scripts/verify-dependency-fixture.py --gradle "$(command -v gradle)" --plugin-jar "$plugin_jar" --android --output build/reports/dependency-min-android
      - name: Verify application R.jar resource witness on minimum AGP and Gradle
        shell: bash
        run: |
          export GRADLE_8_HOME="$(dirname "$(dirname "$(command -v gradle)")")"
          bash Scripts/verify-agp-8-app-snapshot.sh

      - name: Establish layout resource field and test evidence on minimum AGP
        timeout-minutes: 25
        shell: bash
        run: |
          export GRADLE_8_HOME="$(dirname "$(dirname "$(command -v gradle)")")"
          python3 Scripts/verify-agp-8-resource-impact.py
      - name: Preserve bounded resource experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agp-8-resource-impact
          path: build/reports/agp-8-resource-impact/result.json
          if-no-files-found: warn
          retention-days: 14

  # 절대 시간 예산은 runner CPU 종류가 결과를 좌우했다. 같은 runner에서 기준 commit 빌드와 교차 측정해
  # 상대 회귀를 판정하고, 절대 안전 상한(10초/40초)도 함께 적용한다.
  performance:
    runs-on: ubuntu-latest
    # 기준·후보 빌드 2회와 arm별 warm-up 1회·교차 측정 6라운드(느린 runner에서 약 5분)를 담는다.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Select the base commit for the reference build
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) echo "unsupported event for the reference comparison: $EVENT_NAME" >&2; exit 2 ;;
          esac
          # 새 branch push 등의 all-zero/누락/형식 오류 기준을 다른 commit으로 대체하지 않는다.
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0{40}$ ]]; then
            echo "base commit is missing, malformed or all-zero; refusing to choose another reference" >&2
            exit 2
          fi
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: reference
          persist-credentials: false
      # 증거가 가리키는 기준·후보가 실제로 빌드할 checkout과 같은지 먼저 확인한다.
      - name: Verify the checked-out reference and candidate revisions
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          reference_head="$(git -C reference rev-parse HEAD)"
          candidate_head="$(git -C candidate rev-parse HEAD)"
          if [[ "$reference_head" != "$BASE_SHA" || "$candidate_head" != "$GITHUB_SHA" ]]; then
            echo "checked-out revisions do not match the selected base and the event commit" >&2
            exit 2
          fi
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # 두 tree를 같은 명령으로 따로 빌드한다. 측정 입력은 후보 class root라 기준의 class root는 쓰지 않는다.
      - name: Build reference CLI
        working-directory: reference
        run: ./gradlew --no-daemon -Pkotlin.daemon.jvmargs=-Xmx1g :cli:installDist :gradle-plugin:classes
      - name: Build candidate CLI and class roots
        working-directory: candidate
        run: ./gradlew --no-daemon -Pkotlin.daemon.jvmargs=-Xmx1g :cli:installDist :gradle-plugin:classes
      # 절대 합계·비율을 job summary에도 남겨 허용치 아래 회귀가 main push마다 쌓이는지 볼 수 있게 한다.
      - name: Compare analysis time with the reference build on this runner
        id: compare
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          mkdir -p candidate/build/reports/analysis-performance
          python3 candidate/Scripts/verify-analysis-smoke-gate.py --json \
            --repo-root candidate \
            --binary candidate/cli/build/install/kartograph/bin/kartograph \
            --reference-binary reference/cli/build/install/kartograph/bin/kartograph \
            --reference-revision "$BASE_SHA" --candidate-revision "$GITHUB_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" \
            | tee candidate/build/reports/analysis-performance/result.json
      - name: Preserve relative performance evidence
        if: ${{ !cancelled() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: analysis-performance
          path: candidate/build/reports/analysis-performance/result.json
          if-no-files-found: error
          retention-days: 14
