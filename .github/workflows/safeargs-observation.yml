name: Safe Args native observation

on:
  pull_request:
    paths:
      - .github/workflows/safeargs-observation.yml
      - gradle-plugin/src/test/kotlin/dev/kartograph/gradle/AndroidSafeArgsIntegrationTest.kt
      - gradle-plugin/src/test/kotlin/dev/kartograph/gradle/SafeArgsBuildEvidence*.kt
      - Scripts/verify-safeargs-native-test.py
      - Scripts/tests/test_safeargs_native_verifier.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeargs-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-read-only: true
      - name: Record exact observation source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p build/reports/safeargs-workflow
          git rev-parse HEAD HEAD^{tree} > build/reports/safeargs-workflow/source.txt
          printf '%s\n' "$GITHUB_SHA" "$PR_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build/reports/safeargs-workflow/run.txt
      - name: Accept existing CI Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - name: Install the existing fixture platform selection
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Verify observation gate rejection cases
        run: python3 -m unittest discover -s Scripts/tests -p test_safeargs_native_verifier.py -v
      - name: Execute the single Safe Args TestKit observation
        timeout-minutes: 20
        env:
          KARTOGRAPH_SAFEARGS_EVIDENCE_DIR: ${{ github.workspace }}/build/reports/safeargs-native
        run: |
          set +e
          ./gradlew --no-daemon :gradle-plugin:test --tests dev.kartograph.gradle.AndroidSafeArgsIntegrationTest --rerun --no-build-cache --stacktrace 2>&1 | tee build/reports/safeargs-workflow/gradle.log
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > build/reports/safeargs-workflow/gradle-exit.txt
          printf '%s\n' "${statuses[1]}" > build/reports/safeargs-workflow/log-exit.txt
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Require actual unskipped execution and complete observation receipts
        if: ${{ always() && !cancelled() }}
        run: python3 Scripts/verify-safeargs-native-test.py
      - name: Preserve successful or failed observation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safeargs-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/safeargs-native/
            build/reports/safeargs-workflow/
            build/reports/safeargs-native-verification.json
            gradle-plugin/build/test-results/test/TEST-dev.kartograph.gradle.AndroidSafeArgsIntegrationTest.xml
          if-no-files-found: error
          retention-days: 14
