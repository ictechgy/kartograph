name: Release readiness validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full reviewed commit SHA to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Require a full commit SHA
        shell: bash
        run: |
          printf 'EVIDENCE_DIRECTORY=%s/release-readiness-validation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "target_sha must be a full lowercase hexadecimal commit SHA" >&2
            exit 64
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Verify and record the requested source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "$EVIDENCE_DIRECTORY"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE_DIRECTORY/source.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$EVIDENCE_DIRECTORY/workflow.txt"
          # 공용 배포물 스크립트가 생기기 전의 target(rebase하지 않은 PR head, 이전 release commit)은 readiness가 자기 완결이라 그 파일이 없다.
          gates=(Scripts/verify-release-readiness.sh Scripts/verify-analysis-smoke-gate.py)
          if [[ -f Scripts/release-artifacts.sh ]]; then gates+=(Scripts/release-artifacts.sh); fi
          sha256sum "${gates[@]}" > "$EVIDENCE_DIRECTORY/gates.sha256"
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          # 입력 SHA의 코드를 실행한 뒤 기본 브랜치 범위 캐시를 저장하지 않도록 복원만 한다.
          cache-read-only: true
      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null'
      - name: Install resource fixture Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '8.10.2'
          # 입력 SHA의 코드를 실행한 뒤 기본 브랜치 범위 캐시를 저장하지 않도록 복원만 한다.
          cache-read-only: true
      - name: Record runner and Java information
        shell: bash
        run: |
          { uname -a; nproc; free -h; df -h .; java -version; } > "$EVIDENCE_DIRECTORY/runner.txt" 2>&1
      - name: Verify release artifacts without publishing
        shell: bash
        run: |
          export GRADLE_8_HOME="$(dirname "$(dirname "$(command -v gradle)")")"
          set +e
          Scripts/verify-release-readiness.sh 2>&1 | tee "$EVIDENCE_DIRECTORY/gate.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$EVIDENCE_DIRECTORY/gate-exit.txt"
          printf '%s\n' "${statuses[1]}" > "$EVIDENCE_DIRECTORY/log-exit.txt"
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Record retained artifact digests
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIRECTORY"
          shopt -s nullglob
          files=(
            cli/build/distributions/kartograph-*.zip
            cli/build/distributions/kartograph-*.tar
            gradle-plugin/build/libs/kartograph-gradle-plugin-*.jar
            compiler-collectors/build/distributions/kartograph-compiler-collectors-*.zip
            gradle-plugin/build/publications/pluginMaven/pom-default.xml
            build/release/*.cdx.json
            build/release/SHA256SUMS
          )
          : > "$EVIDENCE_DIRECTORY/artifacts.sha256"
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then sha256sum "$file" >> "$EVIDENCE_DIRECTORY/artifacts.sha256"; fi
          done
      - name: Preserve validation evidence and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-readiness-validation/
            build/reports/release-readiness/*.sha256
            build/reports/release-readiness/**/*.log
            build/reports/release-readiness/**/build.stdout
            build/reports/release-readiness/**/build.stderr
            build/reports/release-readiness/**/verification.json
            cli/build/distributions/kartograph-*.zip
            cli/build/distributions/kartograph-*.tar
            gradle-plugin/build/libs/kartograph-gradle-plugin-*.jar
            compiler-collectors/build/distributions/kartograph-compiler-collectors-*.zip
            gradle-plugin/build/publications/pluginMaven/pom-default.xml
            build/release/*.cdx.json
            build/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
