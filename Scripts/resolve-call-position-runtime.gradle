                    'org.jetbrains.kotlin:kotlin-build-tools-compat:2.4.20',
                    'org.jetbrains.kotlin:kotlin-build-tools-cri-impl:2.4.20',
                    'org.jetbrains.kotlin:kotlin-build-tools-impl:2.4.20',
                    'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.20',
                    'org.jetbrains.kotlin:kotlin-compiler-runner:2.4.20',
                    'org.jetbrains.kotlin:kotlin-daemon-client:2.4.20',
