                    def f = artifact.file.canonicalFile
                    assert f.isFile() && f.name.endsWith('.jar') && f.length() <= 128L * 1024 * 1024
                    def digest = MessageDigest.getInstance('SHA-256')
                    f.withInputStream { stream ->
                        byte[] buffer = new byte[65536]
                        for (int n; (n = stream.read(buffer)) > 0;) digest.update(buffer, 0, n)
                    }
                    [group: artifact.moduleVersion.id.group, name: artifact.name,
                     version: artifact.moduleVersion.id.version, classifier: artifact.classifier ?: '',
                     extension: artifact.extension, path: f.absolutePath, bytes: f.length(),
                     sha256: digest.digest().encodeHex().toString()]
