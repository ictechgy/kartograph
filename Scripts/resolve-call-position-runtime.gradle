                def queue = selected.firstLevelModuleDependencies.toList()
                def roots = queue.collect { "${it.moduleGroup}:${it.moduleName}:${it.moduleVersion}" }.sort()
                while (!queue.isEmpty()) {
                    def dep = queue.remove(0)
                    def key = "${dep.moduleGroup}:${dep.moduleName}:${dep.moduleVersion}".toString()
                    if (!nodes.containsKey(key)) {
                        assert nodes.size() < 512
                        def children = dep.children.toList()
                        nodes[key] = children.collect { "${it.moduleGroup}:${it.moduleName}:${it.moduleVersion}".toString() }.sort()
                        queue.addAll(children)
                    }
                }
                [roots: roots, graph: nodes.sort(), artifacts: artifacts]
            }
            // 기존 정렬된 세 역할은 그대로 두고 실제 모듈/메타데이터 경계를 별도 version으로 기록한다.
