                    def value = values[0].textContent.trim()
                    if (!(value ==~ /[A-Za-z0-9_.-]+/) || value == '.' || value == '..') throw new GradleException('unresolved or malformed metadata field')
                    value
                }
                def metadataReferences = []
                def advertisedModules = [] as Set
                def queue = expectedModules.collect { [coordinate: it, reason: 'selected-module'] }
                def fetchedPoms = [] as Set
                while (!queue.isEmpty()) {
                    def request = queue.remove(0)
                    def key = request.coordinate
                    if (fetchedPoms.contains(key)) continue
                    if (fetchedPoms.size() >= 15) throw new GradleException('parent/BOM metadata closure exceeded')
                    def parts = key.split(':', -1)
                    File pomFile
                    if (suppliedFiles != null) {
                        pomFile = suppliedFiles[key + '@pom']
                        if (pomFile == null) throw new GradleException('supplied original POM is absent')
                    } else {
                        def query = p.dependencies.createArtifactResolutionQuery()
                        if (componentIds.containsKey(key)) query.forComponents([componentIds[key]])
                        else query.forModule(parts[0], parts[1], parts[2])
                        def pomResult = query.withArtifacts(MavenModule, MavenPomArtifact).execute()
                        if (pomResult.components.size() != 1 || pomResult.resolvedComponents.size() != 1) throw new GradleException('Maven POM query did not resolve exactly one module')
                        def component = pomResult.resolvedComponents.iterator().next()
                        if (coordinate(component.id) != key) throw new GradleException('Maven POM query selected a different module')
                        def pomArtifacts = component.getArtifacts(MavenPomArtifact)
                        if (pomArtifacts.size() != 1 || !(pomArtifacts.iterator().next() instanceof ResolvedArtifactResult)) throw new GradleException('Maven POM artifact is unavailable')
                        pomFile = pomArtifacts.iterator().next().file
                    }
                    def captured = addMetadata(key, 'pom', pomFile, request.reason)
                    fetchedPoms += key
                    def document = factory.newDocumentBuilder().parse(new ByteArrayInputStream(captured.bytes))
                    def project = document.documentElement
                    if (project.localName != 'project' || project.namespaceURI != 'http://maven.apache.org/POM/4.0.0') throw new GradleException('unexpected Maven metadata root')
                    if (text(project, 'groupId') + ':' + text(project, 'artifactId') + ':' + text(project, 'version') != key) throw new GradleException('POM coordinate contradicts selected module')
                    def references = []
                    children(project, 'parent').each { parent -> references += [reason: 'parent', coordinate: text(parent, 'groupId') + ':' + text(parent, 'artifactId') + ':' + text(parent, 'version')] }
                    children(project, 'dependencyManagement').each { management ->
                        children(management, 'dependencies').each { dependencies ->
                            children(dependencies, 'dependency').each { dependency ->
                                def scopes = children(dependency, 'scope')
                                def types = children(dependency, 'type')
                                if (scopes.size() > 1 || types.size() > 1) throw new GradleException('duplicate dependency metadata selector')
                                if (scopes && scopes[0].textContent.trim() == 'import') {
                                    if (text(dependency, 'type') != 'pom') throw new GradleException('imported metadata is not a POM')
                                    references += [reason: 'imported-bom', coordinate: text(dependency, 'groupId') + ':' + text(dependency, 'artifactId') + ':' + text(dependency, 'version')]
                                }
                            }
                        }
                    }
                    references.each { reference ->
                        if (reference.reason != 'imported-bom' || key != 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0' || reference.coordinate != 'org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.8.0') {
                            throw new GradleException('parent/import metadata closure differs from reviewed BOM')
                        }
                        metadataReferences += [from: key, to: reference.coordinate, reason: reference.reason]
                        queue += reference
                    }
                    if (new String(captured.bytes, java.nio.charset.StandardCharsets.UTF_8).contains('do_not_remove: published-with-gradle-metadata')) advertisedModules += key
                }
                def expectedAdvertised = ['org.jetbrains.kotlin:kotlin-stdlib:2.4.20', 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0'] as Set
                if (advertisedModules != expectedAdvertised || metadataReferences != [[from: 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0', to: 'org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.8.0', reason: 'imported-bom']]) {
                    throw new GradleException('published module/BOM metadata set differs')
                }
                advertisedModules.toList().sort().each { key ->
                    File moduleFile
                    if (suppliedFiles != null) {
                        moduleFile = suppliedFiles[key + '@module']
                        if (moduleFile == null) throw new GradleException('supplied original module metadata is absent')
                    } else {
                        // 메타데이터 파일 하나의 요청만 비전이적이다. 실제 tools configuration은 바꾸지 않는다.
                        def dependency = p.dependencies.create(key + '@module')
                        dependency.transitive = false
                        def metadataOnly = p.configurations.detachedConfiguration(dependency)
                        metadataOnly.transitive = false
                        def artifacts = metadataOnly.resolvedConfiguration.resolvedArtifacts.toList()
                        if (artifacts.size() != 1 || coordinate(artifacts[0].id.componentIdentifier) != key || artifacts[0].extension != 'module' || artifacts[0].classifier) {
                            throw new GradleException('original Gradle module metadata is unavailable or ambiguous')
                        }
                        moduleFile = artifacts[0].file
                    }
                    addMetadata(key, 'module', moduleFile, 'published-gradle-metadata')
                }
                if (metadata.size() != 17 || fetchedPoms.size() != 15) throw new GradleException('module mirror metadata closure is incomplete')
                verifySuppliedManifest()
                [schemaVersion: 1, kotlinVersion: version, requestedRoots: roots, selectedModules: componentIds.keySet().toList().sort(),
                 graph: graph.sort(), artifactlessModules: componentIds.keySet().findAll { !(it in artifactOrder) }.sort(),
                 naturalArtifactOrder: artifactOrder, naturalFileOrder: fileOrder,
                 metadataReferences: metadataReferences, metadata: metadata.sort { it.relativePath }]
            }
            def report = [schemaVersion: 1, compilerVersion: '@@KOTLIN_VERSION@@',
                requestedBuildTools: ['org.jetbrains.kotlin:kotlin-build-tools-compat:@@KOTLIN_VERSION@@',
                                     'org.jetbrains.kotlin:kotlin-build-tools-impl:@@KOTLIN_VERSION@@'],
                roles: [compiler: capture(p.configurations.kotlinCompilerRuntime),
                        plugin: capture(p.buildscript.configurations.classpath), buildTools: capture(tools)]]
            report.moduleMirror = captureModuleMirror(tools)
            report.metadataAcquisition = metadataAcquisition
            def destination = new File(System.getenv('KARTOGRAPH_CALL_RUNTIME_FILE'))
            assert !destination.exists()
            destination.parentFile.mkdirs()
            destination.setText(JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n', 'UTF-8')
        }
    }
}
