                    if (file.name != expectedName) throw new GradleException('metadata artifact filename differs')
                    def bytes = readMetadata(file)
                    if (suppliedRows != null) {
                        def expected = suppliedRows[key + '@' + extension]
                        if (expected == null || file.toPath() != suppliedFiles[key + '@' + extension].toPath() ||
                            bytes.length != expected.bytes || MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() != expected.sha256) {
                            throw new GradleException('supplied original metadata file bytes differ')
                        }
                    }
                    def row = [group: parts[0], name: parts[1], version: parts[2], extension: extension,
                        path: file.absoluteFile.toPath().normalize().toString(),
                        relativePath: parts[0].replace('.', '/') + '/' + parts[1] + '/' + parts[2] + '/' + expectedName,
                        bytes: bytes.length, sha256: MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString(), reason: reason]
                    metadata += row
                    [row: row, bytes: bytes]
                }
                def factory = DocumentBuilderFactory.newInstance()
                factory.setNamespaceAware(true)
                factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
                factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
                factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
                factory.setXIncludeAware(false)
                factory.setExpandEntityReferences(false)
                factory.setAttribute(javax.xml.XMLConstants.ACCESS_EXTERNAL_DTD, '')
                factory.setAttribute(javax.xml.XMLConstants.ACCESS_EXTERNAL_SCHEMA, '')
                def children = { element, name ->
                    def values = []
                    for (def node = element.firstChild; node != null; node = node.nextSibling) {
                        if (node.nodeType == org.w3c.dom.Node.ELEMENT_NODE && node.localName == name && node.namespaceURI == 'http://maven.apache.org/POM/4.0.0') values += node
                    }
