                // artifacts에서 module universe를 만들지 않는다. artifact가 없는 selected component도 위에서 검사한다.
                def naturalArtifacts = cfg.resolvedConfiguration.resolvedArtifacts.toList()
                if (naturalArtifacts.size() != 14) throw new GradleException('module mirror requires fourteen actual artifacts')
                def artifactOrder = []
                def artifactPaths = [:]
                naturalArtifacts.each { artifact ->
                    def key = coordinate(artifact.id.componentIdentifier)
                    if (artifact.classifier || artifact.extension != 'jar' || artifact.name != artifact.moduleVersion.id.name || artifactPaths.containsKey(artifact.file.canonicalPath)) {
                        throw new GradleException('ambiguous module artifact layout')
                    }
                    artifactOrder += key
                    artifactPaths[artifact.file.canonicalPath] = key
                }
                if (artifactOrder.toSet().toList().sort() != expectedModules) throw new GradleException('artifact module closure differs')
                def fileOrder = cfg.files.collect { file ->
                    def key = artifactPaths[file.canonicalPath]
                    if (key == null) throw new GradleException('natural file lacks exact module artifact identity')
                    key
                }
                if (fileOrder.size() != 14 || fileOrder.toSet() != artifactOrder.toSet()) throw new GradleException('natural module file order is incomplete')

                long retainedMetadataBytes = 0
                def metadata = []
                def seenMetadata = [] as Set
                def readMetadata = { File file ->
                    def path = file.toPath().toAbsolutePath().normalize()
                    def before = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                    if (!before.isRegularFile() || before.size() > 256L * 1024 || path.toRealPath() != path) {
                        throw new GradleException('metadata must be a bounded canonical regular file')
                    }
                    byte[] bytes
                    Files.newInputStream(path, LinkOption.NOFOLLOW_LINKS).withCloseable { input -> bytes = input.readNBytes(256 * 1024 + 1) }
                    def after = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                    if (bytes.length != before.size() || bytes.length > 256 * 1024 || !after.isRegularFile() ||
                        before.fileKey() != after.fileKey() || before.size() != after.size() || before.lastModifiedTime() != after.lastModifiedTime()) {
                        throw new GradleException('metadata changed while reading')
                    }
                    retainedMetadataBytes += bytes.length
                    if (retainedMetadataBytes > 4L * 1024 * 1024) throw new GradleException('metadata total byte bound exceeded')
                    bytes
                }
                // CLI가 명시적으로 검증·복사한 입력만 받으며 일반 query 실패 뒤 fallback하지 않는다.
                def metadataEnvironment = ['KARTOGRAPH_CALL_METADATA_INPUT', 'KARTOGRAPH_CALL_METADATA_INPUT_SHA256',
                                           'KARTOGRAPH_CALL_METADATA_PROFILE_SHA256'].collect { System.getenv(it) }
                def suppliedFiles = null
                def suppliedRows = null
                def verifySuppliedManifest = { }
                if (metadataEnvironment.any { it != null }) {
                    if (!gradle.startParameter.offline || metadataEnvironment.any { it == null || it.isEmpty() } ||
                        !(metadataEnvironment[1] ==~ /[0-9a-f]{64}/) ||
                        metadataEnvironment[2] != 'b19c3f3520225b716c4a82d18f28e42bea1fcd9eaf3b864fefda595baf94c32e') {
                        throw new GradleException('supplied original metadata requires explicit offline input and exact profile pins')
                    }
                    def manifestPath = java.nio.file.Path.of(metadataEnvironment[0])
                    if (!manifestPath.isAbsolute() || manifestPath.normalize() != manifestPath || manifestPath.fileName.toString() != 'manifest.json') {
                        throw new GradleException('supplied metadata manifest path is not canonical')
                    }
                    verifySuppliedManifest = {
                        def bytes = readMetadata(manifestPath.toFile())
                        if (MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() != metadataEnvironment[1]) {
                            throw new GradleException('supplied metadata manifest bytes differ')
                        }
                        bytes
                    }
                    def manifest = new JsonSlurper().parse(verifySuppliedManifest())
                    // 해시·경로 기대값은 공급된 manifest가 아닌 검토된 고정 profile에서 온다.
                    def pinnedEntries = [
                        ['org.jetbrains.kotlin:kotlin-build-tools-api:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-build-tools-api/2.4.20/kotlin-build-tools-api-2.4.20.pom', 1137, 'e8cd9ffd7d0886ba1a1795cbf4a34a06681f184aa50f25686effeefb3c1f56f5'],
                        ['org.jetbrains.kotlin:kotlin-build-tools-compat:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-build-tools-compat/2.4.20/kotlin-build-tools-compat-2.4.20.pom', 1374, 'f8e9f647a00bfbc237e3ddff3891b2d4e4a947611b949281658f836def304002'],
                        ['org.jetbrains.kotlin:kotlin-build-tools-cri-impl:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-build-tools-cri-impl/2.4.20/kotlin-build-tools-cri-impl-2.4.20.pom', 1570, '8af52efa886eed45c54d568b692e339b70ddc7c768bee9ab9c2d2f96ed8bb0e1'],
                        ['org.jetbrains.kotlin:kotlin-build-tools-impl:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-build-tools-impl/2.4.20/kotlin-build-tools-impl-2.4.20.pom', 2348, '7a13ab2d818a5de92afa23004aa9baed99671bb48553b7098cf920fa785c3351'],
                        ['org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.20/kotlin-compiler-embeddable-2.4.20.pom', 2647, '269d98cc4c68670c11e4aeb404e1c7c6f31b782321908d7268ba25cd236d59b2'],
                        ['org.jetbrains.kotlin:kotlin-compiler-runner:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-compiler-runner/2.4.20/kotlin-compiler-runner-2.4.20.pom', 1924, '4566946280971fe8d67990ee83480af480e846590f325a40951f62657e26a40a'],
                        ['org.jetbrains.kotlin:kotlin-daemon-client:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-daemon-client/2.4.20/kotlin-daemon-client-2.4.20.pom', 1353, '37cff66ae34c924f0f738106eeb7234e7ace880f199de3362e993f4987025adc'],
                        ['org.jetbrains.kotlin:kotlin-daemon-embeddable:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-daemon-embeddable/2.4.20/kotlin-daemon-embeddable-2.4.20.pom', 1173, 'ca631ce7c7cc2a8ecb47d3462b429004c1cd3488437b3f739e35eafea2033bfb'],
                        ['org.jetbrains.kotlin:kotlin-reflect:1.6.10', 'pom', 'org/jetbrains/kotlin/kotlin-reflect/1.6.10/kotlin-reflect-1.6.10.pom', 1375, '57905524274a00ae028aaccc27283f6bc5925a934a046c1cc5d06c8ee4d6d5a9'],
                        ['org.jetbrains.kotlin:kotlin-script-runtime:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-script-runtime/2.4.20/kotlin-script-runtime-2.4.20.pom', 1134, 'dd0e3846b61a6d641300958cc52e4693cd7b47bd1d626505f383b2f9d23ade0e'],
                        ['org.jetbrains.kotlin:kotlin-stdlib:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-stdlib/2.4.20/kotlin-stdlib-2.4.20.pom', 2301, 'bd69b382dba8e2b7ae3846375eb2f1389017eb908987277051ae4e3acec8c938'],
                        ['org.jetbrains.kotlin:kotlin-stdlib:2.4.20', 'module', 'org/jetbrains/kotlin/kotlin-stdlib/2.4.20/kotlin-stdlib-2.4.20.module', 12431, 'afb28052ac6c3d605c0f661816ea653e073eb039682fed35bfa6cdc704c0911c'],
                        ['org.jetbrains.kotlin:kotlin-tooling-core:2.4.20', 'pom', 'org/jetbrains/kotlin/kotlin-tooling-core/2.4.20/kotlin-tooling-core-2.4.20.pom', 1128, '29dd79ed2bc1e64f6bfd5ccf0c1336c6b6c11ee2a69e0c585e3fad2f45b5325d'],
                        ['org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0', 'pom', 'org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.0/kotlinx-coroutines-core-jvm-1.8.0.pom', 2196, 'a5633abd53467ceb91622d81f2e982080877145e0b76e1b75788715434885d0b'],
                        ['org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0', 'module', 'org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.0/kotlinx-coroutines-core-jvm-1.8.0.module', 4278, 'ff6a22da40040938751db0ae21177e76517dbf126a76796f5426727bf76c1228'],
                        ['org.jetbrains:annotations:13.0', 'pom', 'org/jetbrains/annotations/13.0/annotations-13.0.pom', 4930, '965aeb2bedff369819bdde1bf7a0b3b89b8247dd69c88b86375d76163bb8c397'],
                        ['org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.8.0', 'pom', 'org/jetbrains/kotlinx/kotlinx-coroutines-bom/1.8.0/kotlinx-coroutines-bom-1.8.0.pom', 4291, '1239e9dbe1397cd5971342956b2511bc3ace7b641842e4372a088dcfa8b9ad55']
                    ].collect { row -> [coordinate:row[0], kind:row[1], path:row[2], bytes:row[3], sha256:row[4]] }
                    if (!(manifest instanceof Map) || manifest.keySet() != (['schemaVersion','profile','compilerVersion','entries'] as Set) ||
                        !(manifest.schemaVersion instanceof Integer) || manifest.schemaVersion != 1 ||
                        manifest.profile != 'kartograph-call-position-original-metadata-2.4.20' || manifest.compilerVersion != '2.4.20' ||
                        !(manifest.entries instanceof List) || manifest.entries != pinnedEntries ||
