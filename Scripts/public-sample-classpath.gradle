// 공개 nowinandroid 표본 전용이다. source tree를 수정하지 않고 해석된 의존성을 build 아래 기록한다.
allprojects { consumer ->
    if (consumer.path == ':app') {
        consumer.configurations.all { configuration ->
            if (configuration.name != 'demoDebugRuntimeClasspath') return
            def artifacts = configuration.incoming.artifactView {
                attributes {
                    attribute(Attribute.of('artifactType', String), 'android-classes-jar')
                }
            }.files
            def outputFile = consumer.layout.buildDirectory.file('kartograph-validation-classpath.txt')
            consumer.tasks.register('kartographValidationClasspath') {
                inputs.files(artifacts)
                outputs.file(outputFile)
                doLast {
                    def output = outputFile.get().asFile
                    output.parentFile.mkdirs()
                    output.text = artifacts.files.collect { it.absolutePath }.sort().join('\n')
                }
            }
        }
    }
}
