import groovy.json.JsonOutput
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.testing.Test

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def results = new java.util.concurrent.ConcurrentHashMap<String, Map>()
    def exporters = root.allprojects.sort { it.path }.collect { project ->
        project.tasks.register('kartographEvaluationProjectInputs') {
            doLast {
                def roots = new LinkedHashSet<File>()
                def jars = new LinkedHashSet<File>()
                def resources = new LinkedHashSet<File>()
                def addDirectory = { File directory ->
                    if (directory?.isDirectory() && directory.canonicalPath.startsWith(root.rootDir.canonicalPath + File.separator)) {
                        if (!project.fileTree(directory).matching { include '**/*.class' }.isEmpty()) {
                            roots.add(directory.canonicalFile)
                        } else if (new File(directory, 'META-INF/services').isDirectory()) {
                            resources.add(directory.canonicalFile)
                        }
                    }
                }
                // main 출력이 JAR인 Android도 실제 컴파일 목적지의 선언을 수집한다.
                project.tasks.each { task ->
                    if (task.name.startsWith('compile') && task.hasProperty('destinationDirectory')) {
                        def destination = task.property('destinationDirectory')
                        if (destination instanceof org.gradle.api.file.DirectoryProperty) addDirectory(destination.asFile.orNull)
                    }
                }
                def sources = project.extensions.findByType(SourceSetContainer)
                sources?.each { source ->
                    source.output.classesDirs.files.each(addDirectory)
                    def directory = source.output.resourcesDir
                    if (directory?.isDirectory() && new File(directory, 'META-INF/services').isDirectory()) {
                        if (!project.fileTree(directory).matching { include '**/*.class' }.isEmpty()) {
                            throw new GradleException('Service resource root also contains class fixtures; select its scope explicitly')
                        }
                        resources.add(directory.canonicalFile)
                    }
                }
                // 각 project의 task에서 해당 project의 configuration만 해석한다.
                project.tasks.withType(Test).each { test ->
                    if (test.testClassesDirs.files.any { it.isDirectory() }) {
                        test.classpath.files.each { file ->
                            if (file.isFile() && file.name.endsWith('.jar')) jars.add(file.canonicalFile)
                            if (file.isDirectory()) addDirectory(file)
                        }
                    }
                }
                results[project.path] = [classes: roots.collect { it.path }, classpath: jars.collect { it.path }, resources: resources.collect { it.path }]
            }
        }
    }
    def collector = root.tasks.register('kartographEvaluationInputs') {
        dependsOn(exporters)
        doLast {
            def combined = [classes: [], classpath: [], resources: []]
            results.keySet().sort().each { key ->
                combined.keySet().each { kind -> combined[kind].addAll(results[key][kind]) }
            }
            combined.keySet().each { kind -> combined[kind] = combined[kind].unique().sort() }
            combined.source = 'Compiled task destinations, SourceSet outputs and project-owned Test classpaths'
            def destination = new File(root.findProperty('kartographEvalOutput').toString())
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(combined)) + '\n'
        }
    }
    def buildTasks = root.allprojects.collectMany { it.tasks.toList() }.findAll { !it.name.startsWith('kartographEvaluation') }
    exporters.each { provider -> provider.configure { mustRunAfter(buildTasks) } }
}
